<!-- @dsCard group="Screens" name="進階版 Premium" subtitle="Paywall · benefits + plans" -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SilverBP · 進階版</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/icons.js" defer></script>
<style>.benefit{display:flex;align-items:center;gap:12px;padding:9px 0}.benefit svg{width:24px;height:24px;fill:var(--primary);flex:0 0 auto}</style>
</head>
<body>
<div class="frame">
  <div class="cap">進階版 · Premium<small>付費牆 — 權益清單 + 方案選擇</small></div>
  <div class="phone"><div class="screen">

    <div class="statusbar">
      <span>9:41</span>
      <span class="ico"><svg class="i"><use href="#signal"/></svg><svg class="i"><use href="#wifi"/></svg><svg class="i"><use href="#battery"/></svg></span>
    </div>

    <div class="topbar">
      <span class="spacer"></span>
      <button class="iconbtn"><svg><use href="#close"/></svg></button>
    </div>

    <div class="body">
      <!-- hero -->
      <div style="text-align:center;padding:8px 0 4px">
        <div style="width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--brand-gold) 28%,transparent),transparent 70%);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
          <svg class="i" style="width:54px;height:54px;fill:var(--brand-gold)"><use href="#premium"/></svg>
        </div>
        <div class="headline-s" style="font-weight:700">解鎖 SilverBP 進階版</div>
        <div class="body-l muted" style="margin-top:8px">照顧全家人:完整報告與進階 AI。</div>
      </div>

      <div class="spacer-m"></div>

      <!-- benefits -->
      <div class="card">
        <div class="benefit"><svg><use href="#check_circle"/></svg><span class="body-l">新增無限位家庭成員</span></div>
        <div class="benefit"><svg><use href="#check_circle"/></svg><span class="body-l">無限血糖紀錄</span></div>
        <div class="benefit"><svg><use href="#check_circle"/></svg><span class="body-l">給醫師看的完整多頁 PDF 報告</span></div>
        <div class="benefit"><svg><use href="#check_circle"/></svg><span class="body-l">進階 AI 教練趨勢敘述</span></div>
        <div class="benefit"><svg><use href="#check_circle"/></svg><span class="body-l">更長的 AI 聊天記憶</span></div>
      </div>

      <div class="spacer-m"></div>

      <!-- plans -->
      <div class="card tappable" style="box-shadow:inset 0 0 0 2px var(--primary)">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <div class="title-m" style="font-weight:700">年訂閱 <span class="badge soft" style="margin-left:6px">最划算</span></div>
            <div class="body-m muted" style="margin-top:6px">NT$1,490 / 年</div>
            <div class="label-l" style="color:var(--primary);margin-top:6px">7 天免費試用</div>
          </div>
          <span class="radio on"></span>
        </div>
      </div>
      <div class="card tappable" style="margin-top:12px">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <div class="title-m" style="font-weight:700">月訂閱</div>
            <div class="body-m muted" style="margin-top:6px">NT$170 / 月</div>
          </div>
          <span class="radio"></span>
        </div>
      </div>

      <div class="spacer-l"></div>
      <button class="btn lime block" style="height:60px">訂閱</button>
      <div class="body-m muted" style="text-align:center;margin-top:14px">一份訂閱涵蓋你照顧的所有人——可為長輩購買、由你管理。</div>
      <button class="btn text block" style="margin-top:6px">恢復購買</button>

    </div><!-- /body -->

  </div></div>
</div>
</body>
</html>
